<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org" lang="en">
<head>
    <title>Trainer Sign Up</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Poppins:wght@300;400;600&display=swap');

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #ff1c1c, #ffcc00);
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .signup-card {
            background: white;
            width: 380px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0px 10px 25px rgba(0,0,0,0.25);
            text-align: center;
            border: 4px solid #000;
            position: relative;
        }

        .poke-top {
            width: 100%;
            height: 80px;
            background:#ff1c1c;
            border-bottom: 4px solid black;
            border-radius: 16px 16px 0 0;
            position: absolute;
            top: 0;
            left: 0;
        }

        .poke-button {
            width: 65px;
            height: 65px;
            background: white;
            border: 6px solid black;
            border-radius: 50%;
            position: absolute;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
        }

        h1 {
            margin-top: 120px;
            font-family: 'Press Start 2P', cursive;
            font-size: 18px;
            color: #333;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 85%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #333;
            border-radius: 10px;
            font-size: 15px;
        }

        input[type="submit"] {
            width: 90%;
            padding: 12px;
            background: #ffcc00;
            border: 3px solid #333;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 12px;
            font-family: 'Press Start 2P', cursive;
        }

        input[type="submit"]:hover {
            background: #ffe066;
        }

        .msg {
            margin: 8px 0;
            font-weight: bold;
            color: red;
        }

        .success {
            color: green;
        }
    </style>
</head>

<body>

<div class="signup-card">
    <div class="poke-top"></div>
    <div class="poke-button"></div>

    <h1>Trainer Sign Up</h1>

    <div th:if="${error}" class="msg" th:text="${error}"></div>
    <div th:if="${success}" class="msg success" th:text="${success}"></div>

    <form id="signupForm">
        <input type="text" id="username" placeholder="Trainer Name" required />
        <input type="email" id="email" placeholder="PokéMail" required />
        <input type="password" id="password" placeholder="Secret Key" required />
        <input type="password" id="confirmPassword" placeholder="Confirm Secret Key" required />
        <input type="submit" value="Create Trainer" />
    </form>

    <script>
        document.getElementById("signupForm").addEventListener("submit", function (e) {
            e.preventDefault();

            fetch("/signup", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    username: document.getElementById("username").value,
                    email: document.getElementById("email").value,
                    password: document.getElementById("password").value,
                    confirmPassword: document.getElementById("confirmPassword").value
                })
            });
        });
    </script>
</div>

</body>
</html>
